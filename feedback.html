<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Feedback</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="feedbackstyle.css">
</head>
<body>

<header>
    <h1 id="title">StudentHub Feedback</h1>
</header>

<main>

<fieldset>
    <legend>Feedback Form</legend>

    <form action="/feedback" method="post">

        <p>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </p>

        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </p>

        <p>
            <label for="feedback">Feedback:</label><br>
            <textarea id="feedback" name="feedback" rows="5" cols="35" placeholder="Write your feedback here" required></textarea>
        </p>

        <p>
            <input type="submit" value="Submit">
        </p>

    </form>

</fieldset>

</main>

<footer align="center">
    <p>&copy; 2026 StudentHub</p>
</footer>

</body>
</html>
