<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Registreation</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="registerationstyle.css">
</head>
<body>
    
    <fieldset>
        <legend>Registration form</legend>
    <form>
        <p>
            <label for="name">Name</label><br>
            <input type="text" name="name" id="name" placeholder="Enter your name" autofocus>
        </p>

        <p>
            <label for="DOB">Date Of Birth</label><br>
            <input type="date" name="DOB" id="DOB" required>
        </p>

        <p>
            <label for="address">Address</label><br>
            <input type="text" name="address" id="address" placeholder="Enter your address">
        </p>

        <p>
            <label for="role">Role</label><br>
            <select>
                <option value="Faculty">Faculty</option>
                <option value="admin">admin</option>
                <option value="student">student</option> 
            </select>
        </p>

        <p>
            <label for="password">Password</label><br>
            <input type="password" pattern="[A-Z]{2}[0-9]{2}[a-z]{2}" maxlength="6" required>
        </p>

        <p>
            <input type="submit">
            <input type="reset">
        </p>
        </form>
    </fieldset>

    <footer align="center">

<p>&copy; 2026 StudentHub. All Rights Reserved.</p>

</footer>

</body>
</html>
