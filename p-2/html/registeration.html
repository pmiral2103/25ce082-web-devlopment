    <fieldset>
        <legend>Registration form</legend>
    <form method="post" action="C:\xampp\htdocs\82-lab\form.php">
        <p>
            <label for="name">Name</label><br>
            <input type="text" name="name" id="name" placeholder="Enter your name">
            <span id="nameerror"></span>
        </p>

        <p>
            <label for="DOB">Date Of Birth</label><br>
            <input type="date" name="DOB" id="DOB" required>
        </p>

        <p>
            <label for="address">Address</label><br>
            <input type="text" name="address" id="address" placeholder="Enter your address">
        </p>

        <p>
            <label for="contact">mobile no:</label><br>
            <input type="tel" name="contact" id="contact" placeholder="enter your mobile no." maxlength="10">
            <span id="contacterror"></span>
        </p>

        <p>
            <label for="course">course</label><br>
            <input type="text" name="course" id="course" placeholder="enter your course:(CE,IT,AIML,CS)" pattern="^(CE|IT|CS|AIML)$">
        </p>

        <p class="gender">
            <label>Gender:</label><br>

            <input type="radio" name="gender" id="male" value="male">
             <label for="male">Male</label>

            <input type="radio" name="gender" value="female" id="female">
             <label for="female">female</label> 
             
            <input type="radio" name="gender" value="other" id="other">
             <label for="other">other</label>

            <span id="gendererror"></span>
        </p>

        <p>
            <label for="year">Year:</label><br>
            <input type="text" name="year" id="year" placeholder="enter your year(1,2,3,4)" pattern="^[1-4]$">
        </p>

        <p>
            <label for="role">Role</label><br>
            <select>
                <option value="Faculty">Faculty</option>
                <option value="admin">admin</option>
                <option value="student">student</option> 
            </select>
        </p>

        <p>
            <label for="password">Password</label><br>
            <input type="password" name="password" id="password" pattern="^[A-Z]{2}[0-9]{2}[a-z]{2}$" required>
        </p>

        <p>
        <input type="checkbox" name="terms"  id="terms" required>
        <label for="terms"> I accept the Terms and Conditions</label>
        </p>

        <p>
            <input type="submit" id="submit">
            <input type="reset" id="reset">
        </p>
        </form>
    </fieldset>
